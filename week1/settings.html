<html>
    <head>
        <title>Settings</title>
                 <link rel="stylesheet" href="settings.css">
    </head>
    <body>
                <p><a href="http://127.0.0.1:5500/index.html"><b>Back</b></a></p>
                        <div class="settings">

    <label>
        Laps:
        <select>
            <option>1</option>
            <option selected>3</option>
            <option>5</option>
        </select>
    </label>
    <label>
        Difficulty:
        <select>
            <option>easy</option>
            <option selected>normal</option>
            <option>hard</option>
        </select>
    </label>
    <label>
        speed:
        <select>
            <option>50cc</option>
            <option selected>100cc</option>
            <option>150cc</option>
        </select>
    </label>
    <label>
        <input type="checkbox" checked>
        auto acceleration
    </label>
     <label>
        <input type="checkbox" checked>
        sound
    </label>
     <label>
        <input type="checkbox" checked>
        smart steering
    </label>
</div>
        <img src="images/settings.png" class="background">
    </body>
</html>
